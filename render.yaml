databases:
  - name: supportdesk-db
    databaseName: supportdesk
    user: postgres
    plan: free

services:
  # Backend Web Service (FastAPI)
  - type: web
    name: supportdesk-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --locked
    preDeployCommand: uv run alembic upgrade head && uv run python -m app.seed
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: supportdesk-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: OVERDUE_HOURS
        value: "24"
      - key: CORS_ORIGINS
        value: '["http://localhost:3000"]'

  # Frontend Web Service (Next.js 16)
  - type: web
    name: supportdesk-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: supportdesk-backend
          property: host

