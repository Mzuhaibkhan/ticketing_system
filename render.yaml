databases:
  - name: supportdesk-db
    databaseName: supportdesk
    user: supportdesk
    plan: free

services:
  # Backend Web Service (FastAPI)
  - type: web
    name: supportdesk-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: supportdesk-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: OVERDUE_HOURS
        value: "24"
      - key: SLA_HOURS
        value: '{"urgent": 4, "high": 8, "medium": 24, "low": 48}'
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["http://localhost:3000"]'

  # Frontend Web Service (Next.js 16)
  - type: web
    name: supportdesk-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: supportdesk-backend
          property: host

